<svg xmlns="http://www.w3.org/2000/svg" width="2000" height="1088" viewBox="0 0 2000 1088" font-family="Arial, Helvetica, sans-serif"><defs>
<marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#6B7280"/></marker>
<marker id="arA" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#B45309"/></marker>
</defs>
<rect width="2000" height="1088" fill="#FFFFFF"/>
<text x="40" y="52" font-size="36.0" font-weight="700" fill="#1F2937" text-anchor="start">Processo — decisão de acesso de ponta a ponta</text>
<text x="40" y="88" font-size="20.4" font-weight="400" fill="#4B5563" text-anchor="start">Exemplo do Playbook: conceder acesso a um produto existente. Um pedido só vira acesso depois de revisão, aprovação e implementação.</text>
<rect x="40" y="120" width="220" height="164" rx="6" fill="#F3F4F6" stroke="#D1D5DB" stroke-width="1.5"/><text x="54" y="176" font-size="20.4" font-weight="700" fill="#1F2937" text-anchor="start">Consumidor</text><rect x="270" y="120" width="1690" height="164" rx="6" fill="#FCFCFB" stroke="#E5E7EB" stroke-width="1.5"/><rect x="40" y="292" width="220" height="164" rx="6" fill="#F3F4F6" stroke="#D1D5DB" stroke-width="1.5"/><text x="54" y="348" font-size="20.4" font-weight="700" fill="#1F2937" text-anchor="start">Steward</text><rect x="270" y="292" width="1690" height="164" rx="6" fill="#FFFFFF" stroke="#E5E7EB" stroke-width="1.5"/><rect x="40" y="464" width="220" height="164" rx="6" fill="#F3F4F6" stroke="#D1D5DB" stroke-width="1.5"/><text x="54" y="520" font-size="20.4" font-weight="700" fill="#1F2937" text-anchor="start">Dono (produto,</text><text x="54" y="546.52" font-size="20.4" font-weight="700" fill="#1F2937" text-anchor="start">subdomínio ou</text><text x="54" y="573.04" font-size="20.4" font-weight="700" fill="#1F2937" text-anchor="start">domínio)</text><rect x="270" y="464" width="1690" height="164" rx="6" fill="#FCFCFB" stroke="#E5E7EB" stroke-width="1.5"/><rect x="40" y="636" width="220" height="164" rx="6" fill="#F3F4F6" stroke="#D1D5DB" stroke-width="1.5"/><text x="54" y="692" font-size="20.4" font-weight="700" fill="#1F2937" text-anchor="start">Custodiante</text><text x="54" y="718.52" font-size="20.4" font-weight="700" fill="#1F2937" text-anchor="start">técnico</text><rect x="270" y="636" width="1690" height="164" rx="6" fill="#FFFFFF" stroke="#E5E7EB" stroke-width="1.5"/><rect x="300" y="142" width="250" height="120" rx="10" fill="#FFFFFF" stroke="#1E40AF" stroke-width="1.5"/><text x="312" y="170" font-size="18.0" font-weight="400" fill="#1F2937" text-anchor="start">1. Pede uma versão do</text><text x="312" y="194" font-size="18.0" font-weight="400" fill="#1F2937" text-anchor="start">produto e declara o uso</text><text x="312" y="218" font-size="18.0" font-weight="400" fill="#1F2937" text-anchor="start">pretendido</text><rect x="580" y="314" width="290" height="120" rx="10" fill="#FFFFFF" stroke="#1E40AF" stroke-width="1.5"/><text x="592" y="342" font-size="18.0" font-weight="400" fill="#1F2937" text-anchor="start">2. Verifica propósito,</text><text x="592" y="366" font-size="18.0" font-weight="400" fill="#1F2937" text-anchor="start">significado, classificação</text><text x="592" y="390" font-size="18.0" font-weight="400" fill="#1F2937" text-anchor="start">e adequação</text><rect x="1220" y="658" width="250" height="120" rx="10" fill="#FFFFFF" stroke="#1E40AF" stroke-width="1.5"/><text x="1232" y="686" font-size="18.0" font-weight="400" fill="#1F2937" text-anchor="start">4. Implementa a</text><text x="1232" y="710" font-size="18.0" font-weight="400" fill="#1F2937" text-anchor="start">política autorizada e</text><text x="1232" y="734" font-size="18.0" font-weight="400" fill="#1F2937" text-anchor="start">verifica o acesso</text><rect x="1220" y="142" width="250" height="120" rx="10" fill="#FFFFFF" stroke="#1E40AF" stroke-width="1.5"/><text x="1232" y="170" font-size="18.0" font-weight="400" fill="#1F2937" text-anchor="start">5. Usa o produto dentro</text><text x="1232" y="194" font-size="18.0" font-weight="400" fill="#1F2937" text-anchor="start">do prazo e da</text><text x="1232" y="218" font-size="18.0" font-weight="400" fill="#1F2937" text-anchor="start">finalidade</text><rect x="1500" y="486" width="240" height="120" rx="10" fill="#FFFFFF" stroke="#1E40AF" stroke-width="1.5"/><text x="1512" y="514" font-size="18.0" font-weight="400" fill="#1F2937" text-anchor="start">6. Revê uso, prazo,</text><text x="1512" y="538" font-size="18.0" font-weight="400" fill="#1F2937" text-anchor="start">exceções e necessidade</text><text x="1512" y="562" font-size="18.0" font-weight="400" fill="#1F2937" text-anchor="start">(com o consumidor)</text><rect x="900" y="142" width="260" height="120" rx="10" fill="#FFE4E6" stroke="#9F1239" stroke-width="1.5"/><text x="912" y="170" font-size="18.0" font-weight="400" fill="#1F2937" text-anchor="start">Recebe a recusa com</text><text x="912" y="194" font-size="18.0" font-weight="400" fill="#1F2937" text-anchor="start">justificativa registrada</text><rect x="1700" y="658" width="250" height="120" rx="10" fill="#FFE4E6" stroke="#9F1239" stroke-width="1.5"/><text x="1712" y="686" font-size="18.0" font-weight="400" fill="#1F2937" text-anchor="start">Revoga o acesso ao fim</text><text x="1712" y="710" font-size="18.0" font-weight="400" fill="#1F2937" text-anchor="start">da finalidade ou do</text><text x="1712" y="734" font-size="18.0" font-weight="400" fill="#1F2937" text-anchor="start">prazo</text><path d="M1030,471 L1175,546 L1030,621 L885,546 Z" fill="#FEF3C7" stroke="#B45309" stroke-width="1.5"/><text x="1030" y="523.24" font-size="16.8" font-weight="600" fill="#1F2937" text-anchor="middle">3. Decide:</text><text x="1030" y="545.08" font-size="16.8" font-weight="600" fill="#1F2937" text-anchor="middle">aprova, recusa</text><text x="1030" y="566.92" font-size="16.8" font-weight="600" fill="#1F2937" text-anchor="middle">ou escala?</text><path d="M1855,481 L1955,546 L1855,611 L1755,546 Z" fill="#FEF3C7" stroke="#B45309" stroke-width="1.5"/><text x="1855" y="534.16" font-size="16.8" font-weight="600" fill="#1F2937" text-anchor="middle">Ainda</text><text x="1855" y="556" font-size="16.8" font-weight="600" fill="#1F2937" text-anchor="middle">necessário?</text><path d="M550,202 H565 V374 H580" fill="none" stroke="#6B7280" stroke-width="2" marker-end="url(#ar)"/><path d="M870,374 H877.5 V546 H885" fill="none" stroke="#6B7280" stroke-width="2" marker-end="url(#ar)"/><path d="M1175,546 H1198 V718 H1220" fill="none" stroke="#6B7280" stroke-width="2" marker-end="url(#ar)"/><text x="1142" y="512" font-size="15.6" font-weight="700" fill="#166534" text-anchor="start">aprova</text><path d="M1030,471 V262" fill="none" stroke="#6B7280" stroke-width="2" marker-end="url(#ar)"/><text x="1038" y="454" font-size="15.6" font-weight="700" fill="#9F1239" text-anchor="start">recusa</text><rect x="300" y="486" width="250" height="120" rx="10" fill="#F3F4F6" stroke="#4B5563" stroke-width="1.5"/><text x="312" y="514" font-size="18.0" font-weight="400" fill="#1F2937" text-anchor="start">Escalado: dono do</text><text x="312" y="538" font-size="18.0" font-weight="400" fill="#1F2937" text-anchor="start">domínio ou fórum decide</text><text x="312" y="562" font-size="18.0" font-weight="400" fill="#1F2937" text-anchor="start">e devolve ao passo 3</text><path d="M1030,621 V624 H425 V606" fill="none" stroke="#6B7280" stroke-width="2" stroke-dasharray="5 4" marker-end="url(#ar)"/><text x="830" y="616" font-size="15.6" font-weight="700" fill="#4B5563" text-anchor="start">escala</text><path d="M1415,658 V262" fill="none" stroke="#6B7280" stroke-width="2" marker-end="url(#ar)"/><path d="M1470,202 H1485 V546 H1500" fill="none" stroke="#6B7280" stroke-width="2" marker-end="url(#ar)"/><path d="M1740,546 H1755" fill="none" stroke="#6B7280" stroke-width="2" marker-end="url(#ar)"/><path d="M1855,611 V658" fill="none" stroke="#6B7280" stroke-width="2" marker-end="url(#ar)"/><text x="1863" y="632" font-size="15.6" font-weight="700" fill="#9F1239" text-anchor="start">não</text><path d="M1855,481 V98 H425 V142" fill="none" stroke="#B45309" stroke-width="2" stroke-dasharray="7 5" marker-end="url(#arA)"/><text x="1863" y="470" font-size="15.6" font-weight="700" fill="#166534" text-anchor="start">sim: renova</text><text x="1600" y="90" font-size="15.6" font-weight="700" fill="#B45309" text-anchor="middle">renovação = novo pedido ligado ao anterior</text><rect x="40" y="818" width="1920" height="64" rx="8" fill="#FEF3C7" stroke="#B45309" stroke-width="1.5"/><text x="58" y="844" font-size="18.0" font-weight="700" fill="#1F2937" text-anchor="start">Exceção (quando a regra não pode ser cumprida):</text><text x="58" y="868" font-size="16.8" font-weight="400" fill="#4B5563" text-anchor="start">registrar regra afetada · justificativa · risco · quem aprovou · controle compensatório · data de expiração ou revisão. Não é atalho permanente ao baseline.</text><text x="40" y="920" font-size="19.2" font-weight="700" fill="#1F2937" text-anchor="start">Evidência gerada em cada passo</text><rect x="40" y="934" width="310" height="68" rx="8" fill="#FFFFFF" stroke="#D1D5DB" stroke-width="1.5"/><text x="52" y="958" font-size="16.8" font-weight="400" fill="#1F2937" text-anchor="start">1. Pedido com finalidade</text><rect x="362" y="934" width="310" height="68" rx="8" fill="#FFFFFF" stroke="#D1D5DB" stroke-width="1.5"/><text x="374" y="958" font-size="16.8" font-weight="400" fill="#1F2937" text-anchor="start">2. Parecer do steward</text><rect x="684" y="934" width="310" height="68" rx="8" fill="#FFFFFF" stroke="#D1D5DB" stroke-width="1.5"/><text x="696" y="958" font-size="16.8" font-weight="400" fill="#1F2937" text-anchor="start">3. Decisão com justificativa e</text><text x="696" y="979.84" font-size="16.8" font-weight="400" fill="#1F2937" text-anchor="start">papel exercido</text><rect x="1006" y="934" width="310" height="68" rx="8" fill="#FFFFFF" stroke="#D1D5DB" stroke-width="1.5"/><text x="1018" y="958" font-size="16.8" font-weight="400" fill="#1F2937" text-anchor="start">4. Política aplicada e</text><text x="1018" y="979.84" font-size="16.8" font-weight="400" fill="#1F2937" text-anchor="start">verificada</text><rect x="1328" y="934" width="310" height="68" rx="8" fill="#FFFFFF" stroke="#D1D5DB" stroke-width="1.5"/><text x="1340" y="958" font-size="16.8" font-weight="400" fill="#1F2937" text-anchor="start">5. Registro de uso</text><rect x="1650" y="934" width="310" height="68" rx="8" fill="#FFFFFF" stroke="#D1D5DB" stroke-width="1.5"/><text x="1662" y="958" font-size="16.8" font-weight="400" fill="#1F2937" text-anchor="start">6. Revisão, renovação ou</text><text x="1662" y="979.84" font-size="16.8" font-weight="400" fill="#1F2937" text-anchor="start">revogação</text><text x="40" y="1034" font-size="16.8" font-weight="400" fill="#4B5563" text-anchor="start" font-style="italic">Aprovação e implementação são atos distintos, ambos com evidência. Na implementação de referência: pedido no Consumer, decisão em Producer › Pendências, concessão com prazo aplicada no Ranger/Trino, WSO2 ou Superset.</text>
<text x="1960" y="1070" font-size="14.4" font-weight="400" fill="#9CA3AF" text-anchor="end">KDV Framework · análise do site · 20/10/2026</text>
</svg>