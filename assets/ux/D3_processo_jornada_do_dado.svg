<rect width="2000" height="1404" fill="#FFFFFF"/>
<text x="40" y="52" font-size="36.0" font-weight="700" fill="#1F2937" text-anchor="start">Processo — jornada do dado em raias por papel</text>
<text x="40" y="88" font-size="20.4" font-weight="400" fill="#4B5563" text-anchor="start">Do caso de uso ao valor observado: quem faz o quê em cada etapa, onde se decide e que evidência fica.</text>
<rect x="270" y="128" width="420" height="70" rx="8" fill="#DCFCE7" stroke="#166534" stroke-width="1.5"/><text x="480" y="158" font-size="22.8" font-weight="700" fill="#166534" text-anchor="middle">1. Preparar os dados</text><text x="480" y="182" font-size="16.8" font-weight="400" fill="#4B5563" text-anchor="middle">Cultivar — Preparar com propósito</text><rect x="702" y="128" width="420" height="70" rx="8" fill="#DBEAFE" stroke="#1E40AF" stroke-width="1.5"/><text x="912" y="158" font-size="22.8" font-weight="700" fill="#1E40AF" text-anchor="middle">2. Definir regras e responsáveis</text><text x="912" y="182" font-size="16.8" font-weight="400" fill="#4B5563" text-anchor="middle">Governar — Tornar a confiança aplicável</text><rect x="1134" y="128" width="420" height="70" rx="8" fill="#EDE9FE" stroke="#5B21B6" stroke-width="1.5"/><text x="1344" y="158" font-size="22.8" font-weight="700" fill="#5B21B6" text-anchor="middle">3. Publicar para quem precisa</text><text x="1344" y="182" font-size="16.8" font-weight="400" fill="#4B5563" text-anchor="middle">Compartilhar — Publicar um acordo</text><rect x="1566" y="128" width="420" height="70" rx="8" fill="#FEF3C7" stroke="#B45309" stroke-width="1.5"/><text x="1776" y="158" font-size="22.8" font-weight="700" fill="#B45309" text-anchor="middle">4. Usar e medir o valor</text><text x="1776" y="182" font-size="16.8" font-weight="400" fill="#4B5563" text-anchor="middle">Ativar — Observar o valor</text><rect x="40" y="214" width="220" height="124" rx="6" fill="#F3F4F6" stroke="#D1D5DB" stroke-width="1.5"/><text x="54" y="277" font-size="20.4" font-weight="700" fill="#1F2937" text-anchor="start">Consumidor</text><rect x="270" y="214" width="1716" height="124" rx="6" fill="#FCFCFB" stroke="#E5E7EB" stroke-width="1.5"/><rect x="40" y="344" width="220" height="124" rx="6" fill="#F3F4F6" stroke="#D1D5DB" stroke-width="1.5"/><text x="54" y="407" font-size="20.4" font-weight="700" fill="#1F2937" text-anchor="start">Dono do produto</text><rect x="270" y="344" width="1716" height="124" rx="6" fill="#FFFFFF" stroke="#E5E7EB" stroke-width="1.5"/><rect x="40" y="474" width="220" height="124" rx="6" fill="#F3F4F6" stroke="#D1D5DB" stroke-width="1.5"/><text x="54" y="537" font-size="20.4" font-weight="700" fill="#1F2937" text-anchor="start">Engenharia de</text><text x="54" y="563.52" font-size="20.4" font-weight="700" fill="#1F2937" text-anchor="start">dados</text><rect x="270" y="474" width="1716" height="124" rx="6" fill="#FCFCFB" stroke="#E5E7EB" stroke-width="1.5"/><rect x="40" y="604" width="220" height="124" rx="6" fill="#F3F4F6" stroke="#D1D5DB" stroke-width="1.5"/><text x="54" y="667" font-size="20.4" font-weight="700" fill="#1F2937" text-anchor="start">Steward</text><rect x="270" y="604" width="1716" height="124" rx="6" fill="#FFFFFF" stroke="#E5E7EB" stroke-width="1.5"/><rect x="40" y="734" width="220" height="124" rx="6" fill="#F3F4F6" stroke="#D1D5DB" stroke-width="1.5"/><text x="54" y="797" font-size="20.4" font-weight="700" fill="#1F2937" text-anchor="start">Dono do domínio</text><rect x="270" y="734" width="1716" height="124" rx="6" fill="#FCFCFB" stroke="#E5E7EB" stroke-width="1.5"/><rect x="40" y="864" width="220" height="124" rx="6" fill="#F3F4F6" stroke="#D1D5DB" stroke-width="1.5"/><text x="54" y="927" font-size="20.4" font-weight="700" fill="#1F2937" text-anchor="start">Custodiante</text><text x="54" y="953.52" font-size="20.4" font-weight="700" fill="#1F2937" text-anchor="start">técnico</text><rect x="270" y="864" width="1716" height="124" rx="6" fill="#FFFFFF" stroke="#E5E7EB" stroke-width="1.5"/><circle cx="310" cy="266" r="22" fill="#DCFCE7" stroke="#166534" stroke-width="2"/><text x="310" y="270" font-size="13.2" font-weight="700" fill="#166534" text-anchor="middle">início</text><rect x="350" y="228" width="300" height="96" rx="10" fill="#FFFFFF" stroke="#166534" stroke-width="1.5"/><text x="362" y="258" font-size="18.0" font-weight="400" fill="#1F2937" text-anchor="start">Expressa a decisão que</text><text x="362" y="282" font-size="18.0" font-weight="400" fill="#1F2937" text-anchor="start">precisa apoiar</text><rect x="350" y="358" width="300" height="96" rx="10" fill="#FFFFFF" stroke="#166534" stroke-width="1.5"/><text x="362" y="388" font-size="18.0" font-weight="400" fill="#1F2937" text-anchor="start">Define caso de uso,</text><text x="362" y="412" font-size="18.0" font-weight="400" fill="#1F2937" text-anchor="start">propósito e consumidor</text><rect x="350" y="488" width="300" height="96" rx="10" fill="#FFFFFF" stroke="#166534" stroke-width="1.5"/><text x="362" y="518" font-size="18.0" font-weight="400" fill="#1F2937" text-anchor="start">Conecta fontes, documenta</text><text x="362" y="542" font-size="18.0" font-weight="400" fill="#1F2937" text-anchor="start">origem e prepara dados</text><rect x="732" y="618" width="300" height="96" rx="10" fill="#FFFFFF" stroke="#1E40AF" stroke-width="1.5"/><text x="744" y="648" font-size="18.0" font-weight="400" fill="#1F2937" text-anchor="start">Propõe definições,</text><text x="744" y="672" font-size="18.0" font-weight="400" fill="#1F2937" text-anchor="start">classificação e limites de</text><text x="744" y="696" font-size="18.0" font-weight="400" fill="#1F2937" text-anchor="start">qualidade</text><rect x="732" y="358" width="300" height="96" rx="10" fill="#FFFFFF" stroke="#1E40AF" stroke-width="1.5"/><text x="744" y="388" font-size="18.0" font-weight="400" fill="#1F2937" text-anchor="start">Redige o contrato versionado</text><rect x="732" y="748" width="300" height="96" rx="10" fill="#FFFFFF" stroke="#1E40AF" stroke-width="1.5"/><text x="744" y="778" font-size="18.0" font-weight="400" fill="#1F2937" text-anchor="start">Valida usos permitidos e</text><text x="744" y="802" font-size="18.0" font-weight="400" fill="#1F2937" text-anchor="start">direitos de decisão</text><rect x="1164" y="358" width="300" height="96" rx="10" fill="#FFFFFF" stroke="#5B21B6" stroke-width="1.5"/><text x="1176" y="388" font-size="18.0" font-weight="400" fill="#1F2937" text-anchor="start">Publica metadados, termos e</text><text x="1176" y="412" font-size="18.0" font-weight="400" fill="#1F2937" text-anchor="start">versão</text><rect x="1164" y="228" width="300" height="96" rx="10" fill="#FFFFFF" stroke="#5B21B6" stroke-width="1.5"/><text x="1176" y="258" font-size="18.0" font-weight="400" fill="#1F2937" text-anchor="start">Descobre o produto e pede</text><text x="1176" y="282" font-size="18.0" font-weight="400" fill="#1F2937" text-anchor="start">acesso</text><rect x="1164" y="618" width="300" height="96" rx="10" fill="#FFFFFF" stroke="#5B21B6" stroke-width="1.5"/><text x="1176" y="648" font-size="18.0" font-weight="400" fill="#1F2937" text-anchor="start">Revê o pedido (fluxo de</text><text x="1176" y="672" font-size="18.0" font-weight="400" fill="#1F2937" text-anchor="start">acesso)</text><rect x="1164" y="878" width="300" height="96" rx="10" fill="#FFFFFF" stroke="#5B21B6" stroke-width="1.5"/><text x="1176" y="908" font-size="18.0" font-weight="400" fill="#1F2937" text-anchor="start">Aplica a política de acesso</text><text x="1176" y="932" font-size="18.0" font-weight="400" fill="#1F2937" text-anchor="start">autorizada</text><rect x="1596" y="228" width="300" height="96" rx="10" fill="#FFFFFF" stroke="#B45309" stroke-width="1.5"/><text x="1608" y="258" font-size="18.0" font-weight="400" fill="#1F2937" text-anchor="start">Usa em analytics, aplicações</text><text x="1608" y="282" font-size="18.0" font-weight="400" fill="#1F2937" text-anchor="start">ou IA; reporta problemas</text><rect x="1596" y="358" width="300" height="96" rx="10" fill="#FFFFFF" stroke="#B45309" stroke-width="1.5"/><text x="1608" y="388" font-size="18.0" font-weight="400" fill="#1F2937" text-anchor="start">Acompanha o indicador de</text><text x="1608" y="412" font-size="18.0" font-weight="400" fill="#1F2937" text-anchor="start">valor; decide melhorar ou</text><text x="1608" y="436" font-size="18.0" font-weight="400" fill="#1F2937" text-anchor="start">retirar</text><path d="M332,266 H350" fill="none" stroke="#6B7280" stroke-width="2" marker-end="url(#ar)"/><path d="M500,324 V358" fill="none" stroke="#6B7280" stroke-width="2" marker-end="url(#ar)"/><path d="M500,454 V488" fill="none" stroke="#6B7280" stroke-width="2" marker-end="url(#ar)"/><path d="M650,536 H691 V666 H732" fill="none" stroke="#6B7280" stroke-width="2" marker-end="url(#ar)"/><path d="M822,618 V454" fill="none" stroke="#6B7280" stroke-width="2" marker-end="url(#ar)"/><path d="M882,714 V748" fill="none" stroke="#6B7280" stroke-width="2" marker-end="url(#ar)"/><path d="M1032,406 H1098 V406 H1164" fill="none" stroke="#6B7280" stroke-width="2" marker-end="url(#ar)"/><path d="M1032,796 H1072 V426 H1164" fill="none" stroke="#6B7280" stroke-width="2" stroke-dasharray="5 4" marker-end="url(#ar)"/><path d="M1314,358 V324" fill="none" stroke="#6B7280" stroke-width="2" marker-end="url(#ar)"/><path d="M1464,276 H1488 V666 H1464" fill="none" stroke="#6B7280" stroke-width="2" marker-end="url(#ar)"/><path d="M1314,714 V878" fill="none" stroke="#6B7280" stroke-width="2" marker-end="url(#ar)"/><path d="M1464,926 H1530 V296 H1596" fill="none" stroke="#6B7280" stroke-width="2" marker-end="url(#ar)"/><path d="M1746,324 V358" fill="none" stroke="#6B7280" stroke-width="2" marker-end="url(#ar)"/><path d="M1896,406 H1970 V110 H310 V126" fill="none" stroke="#B45309" stroke-width="2.2" stroke-dasharray="8 6" marker-end="url(#arA)"/><text x="1600" y="102" font-size="16.8" font-weight="700" fill="#B45309" text-anchor="middle">retorno: o uso alimenta a próxima iteração</text><text x="40" y="1056" font-size="20.4" font-weight="700" fill="#1F2937" text-anchor="start">Ponto de decisão</text><path d="M480,1004 L690,1066 L480,1128 L270,1066 Z" fill="#FEF3C7" stroke="#B45309" stroke-width="1.5"/><text x="480" y="1045.58" font-size="15.6" font-weight="600" fill="#1F2937" text-anchor="middle">A fonte está autorizada e</text><text x="480" y="1065.86" font-size="15.6" font-weight="600" fill="#1F2937" text-anchor="middle">o resultado pode ser</text><text x="480" y="1086.1399999999999" font-size="15.6" font-weight="600" fill="#1F2937" text-anchor="middle">explicado?</text><path d="M912,1004 L1122,1066 L912,1128 L702,1066 Z" fill="#FEF3C7" stroke="#B45309" stroke-width="1.5"/><text x="912" y="1045.58" font-size="15.6" font-weight="600" fill="#1F2937" text-anchor="middle">Responsáveis, termos e</text><text x="912" y="1065.86" font-size="15.6" font-weight="600" fill="#1F2937" text-anchor="middle">expectativas de qualidade</text><text x="912" y="1086.1399999999999" font-size="15.6" font-weight="600" fill="#1F2937" text-anchor="middle">foram revistos?</text><path d="M1344,1004 L1554,1066 L1344,1128 L1134,1066 Z" fill="#FEF3C7" stroke="#B45309" stroke-width="1.5"/><text x="1344" y="1045.58" font-size="15.6" font-weight="600" fill="#1F2937" text-anchor="middle">O consumidor previsto</text><text x="1344" y="1065.86" font-size="15.6" font-weight="600" fill="#1F2937" text-anchor="middle">descobre e acessa a versão</text><text x="1344" y="1086.1399999999999" font-size="15.6" font-weight="600" fill="#1F2937" text-anchor="middle">autorizada?</text><path d="M1776,1004 L1986,1066 L1776,1128 L1566,1066 Z" fill="#FEF3C7" stroke="#B45309" stroke-width="1.5"/><text x="1776" y="1045.58" font-size="15.6" font-weight="600" fill="#1F2937" text-anchor="middle">Valor e limitações</text><text x="1776" y="1065.86" font-size="15.6" font-weight="600" fill="#1F2937" text-anchor="middle">revistos: melhorar ou</text><text x="1776" y="1086.1399999999999" font-size="15.6" font-weight="600" fill="#1F2937" text-anchor="middle">retirar?</text><text x="40" y="1178" font-size="20.4" font-weight="700" fill="#1F2937" text-anchor="start">Evidência a guardar</text><rect x="270" y="1144" width="420" height="96" rx="8" fill="#FEF3C7" stroke="#B45309" stroke-width="1.5"/><text x="284" y="1172" font-size="16.8" font-weight="400" fill="#1F2937" text-anchor="start">Inventário de fontes · registro das</text><text x="284" y="1193.84" font-size="16.8" font-weight="400" fill="#1F2937" text-anchor="start">transformações · testes iniciais de</text><text x="284" y="1215.68" font-size="16.8" font-weight="400" fill="#1F2937" text-anchor="start">qualidade</text><rect x="702" y="1144" width="420" height="96" rx="8" fill="#FEF3C7" stroke="#B45309" stroke-width="1.5"/><text x="716" y="1172" font-size="16.8" font-weight="400" fill="#1F2937" text-anchor="start">Glossário · contrato versionado ·</text><text x="716" y="1193.84" font-size="16.8" font-weight="400" fill="#1F2937" text-anchor="start">resultados de qualidade · decisões de</text><text x="716" y="1215.68" font-size="16.8" font-weight="400" fill="#1F2937" text-anchor="start">política</text><rect x="1134" y="1144" width="420" height="96" rx="8" fill="#FEF3C7" stroke="#B45309" stroke-width="1.5"/><text x="1148" y="1172" font-size="16.8" font-weight="400" fill="#1F2937" text-anchor="start">Contrato publicado · aprovação · política</text><text x="1148" y="1193.84" font-size="16.8" font-weight="400" fill="#1F2937" text-anchor="start">de acesso · histórico de versões</text><rect x="1566" y="1144" width="420" height="96" rx="8" fill="#FEF3C7" stroke="#B45309" stroke-width="1.5"/><text x="1580" y="1172" font-size="16.8" font-weight="400" fill="#1F2937" text-anchor="start">Registro de uso · indicador de resultado ·</text><text x="1580" y="1193.84" font-size="16.8" font-weight="400" fill="#1F2937" text-anchor="start">problemas · decisão de melhoria</text><text x="40" y="1280" font-size="20.4" font-weight="700" fill="#1F2937" text-anchor="start">Exemplo de medida</text><text x="480" y="1280" font-size="16.8" font-weight="400" fill="#4B5563" text-anchor="middle" font-style="italic">Cobertura de fontes; falhas na entrega</text><text x="912" y="1280" font-size="16.8" font-weight="400" fill="#4B5563" text-anchor="middle" font-style="italic">Cobertura de responsáveis; exceções de qualidade</text><text x="1344" y="1280" font-size="16.8" font-weight="400" fill="#4B5563" text-anchor="middle" font-style="italic">Tempo de aprovação de acesso; adoção do contrato</text><text x="1776" y="1280" font-size="16.8" font-weight="400" fill="#4B5563" text-anchor="middle" font-style="italic">Uso face ao propósito; incidentes; indicador de valor</text><rect x="40" y="1308" width="1920" height="56" rx="8" fill="#1F2937" stroke="#1F2937" stroke-width="1.5"/><text x="60" y="1343" font-size="18.0" font-weight="700" fill="#FFFFFF" text-anchor="start">Ritmo de governança:  a cada publicação — rever contrato, responsáveis, qualidade e acesso  ·  semanal — triar problemas e pedidos  ·  mensal — fórum revê resultados, exceções e políticas</text>
