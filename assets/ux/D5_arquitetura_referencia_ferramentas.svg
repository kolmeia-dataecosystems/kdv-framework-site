<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="1164" viewBox="0 0 1800 1164" font-family="Arial, Helvetica, sans-serif"><defs>
<marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#6B7280"/></marker>
<marker id="arA" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#B45309"/></marker>
</defs>
<rect width="1800" height="1164" fill="#FFFFFF"/>
<text x="40" y="52" font-size="36.0" font-weight="700" fill="#1F2937" text-anchor="start">Arquitetura de referência — dos quatro blocos às ferramentas</text>
<text x="40" y="88" font-size="20.4" font-weight="400" fill="#4B5563" text-anchor="start">Como a instalação de referência (kdvcloud-eu) implementa o framework. O método também pode ser aplicado com outras ferramentas.</text>
<text x="40" y="130" font-size="18.0" font-weight="700" fill="#B45309" text-anchor="start" letter-spacing="1">QUEM USA — módulos KDV (interface por papel)</text><rect x="40" y="146" width="419.5" height="84" rx="8" fill="#1F2937" stroke="#1F2937" stroke-width="1.5"/><text x="249.75" y="178" font-size="21.6" font-weight="700" fill="#FDE68A" text-anchor="middle">KDV Consumer</text><text x="249.75" y="204" font-size="15.6" font-weight="400" fill="#E5E7EB" text-anchor="middle">Quem pede e usa dados (consumidor)</text><rect x="473.5" y="146" width="419.5" height="84" rx="8" fill="#1F2937" stroke="#1F2937" stroke-width="1.5"/><text x="683.25" y="178" font-size="21.6" font-weight="700" fill="#FDE68A" text-anchor="middle">KDV Producer</text><text x="683.25" y="204" font-size="15.6" font-weight="400" fill="#E5E7EB" text-anchor="middle">Quem prepara, governa e publica (dono,</text><text x="683.25" y="224.28" font-size="15.6" font-weight="400" fill="#E5E7EB" text-anchor="middle">steward, engenharia)</text><rect x="907" y="146" width="419.5" height="84" rx="8" fill="#1F2937" stroke="#1F2937" stroke-width="1.5"/><text x="1116.75" y="178" font-size="21.6" font-weight="700" fill="#FDE68A" text-anchor="middle">KDV EcOps</text><text x="1116.75" y="204" font-size="15.6" font-weight="400" fill="#E5E7EB" text-anchor="middle">Quem governa o ecossistema (fórum, gestor,</text><text x="1116.75" y="224.28" font-size="15.6" font-weight="400" fill="#E5E7EB" text-anchor="middle">dono do domínio)</text><rect x="1340.5" y="146" width="419.5" height="84" rx="8" fill="#1F2937" stroke="#1F2937" stroke-width="1.5"/><text x="1550.25" y="178" font-size="21.6" font-weight="700" fill="#FDE68A" text-anchor="middle">KDV PlatOps</text><text x="1550.25" y="204" font-size="15.6" font-weight="400" fill="#E5E7EB" text-anchor="middle">Quem opera a plataforma (custodiante técnico)</text><rect x="40" y="244" width="1720" height="40" rx="8" fill="#F3F4F6" stroke="#D1D5DB" stroke-width="1.5"/><text x="900" y="270" font-size="18.0" font-weight="700" fill="#1F2937" text-anchor="middle">Adapters (API da plataforma e do ecossistema) · KDV Desk (chamados e escalonamento)</text><text x="40" y="322" font-size="18.0" font-weight="700" fill="#B45309" text-anchor="start" letter-spacing="1">O QUE RODA — ferramentas open source do data lakehouse, por etapa</text><rect x="40" y="336" width="419.5" height="60" rx="8" fill="#DCFCE7" stroke="#166534" stroke-width="1.5"/><text x="249.75" y="362" font-size="21.6" font-weight="700" fill="#166534" text-anchor="middle">1. Preparar os dados</text><text x="249.75" y="384" font-size="16.8" font-weight="400" fill="#4B5563" text-anchor="middle">Cultivar</text><rect x="40" y="408" width="419.5" height="90" rx="8" fill="#FFFFFF" stroke="#16653488" stroke-width="1.5"/><text x="56" y="440" font-size="20.4" font-weight="700" fill="#1F2937" text-anchor="start">Mage + kdv-pipelines</text><text x="56" y="464" font-size="16.8" font-weight="400" fill="#4B5563" text-anchor="start">Pipelines com qualidade e linhagem</text><rect x="40" y="508" width="419.5" height="90" rx="8" fill="#FFFFFF" stroke="#16653488" stroke-width="1.5"/><text x="56" y="540" font-size="20.4" font-weight="700" fill="#1F2937" text-anchor="start">SeaweedFS</text><text x="56" y="564" font-size="16.8" font-weight="400" fill="#4B5563" text-anchor="start">Armazenamento de objetos (S3)</text><rect x="40" y="608" width="419.5" height="90" rx="8" fill="#FFFFFF" stroke="#16653488" stroke-width="1.5"/><text x="56" y="640" font-size="20.4" font-weight="700" fill="#1F2937" text-anchor="start">Apache Iceberg + Hive Metastore</text><text x="56" y="664" font-size="16.8" font-weight="400" fill="#4B5563" text-anchor="start">Tabelas do lake, um catálogo por domínio</text><path d="M460.5,366 H472.5" fill="none" stroke="#6B7280" stroke-width="2" marker-end="url(#ar)"/><rect x="473.5" y="336" width="419.5" height="60" rx="8" fill="#DBEAFE" stroke="#1E40AF" stroke-width="1.5"/><text x="683.25" y="362" font-size="21.6" font-weight="700" fill="#1E40AF" text-anchor="middle">2. Definir regras e responsáveis</text><text x="683.25" y="384" font-size="16.8" font-weight="400" fill="#4B5563" text-anchor="middle">Governar</text><rect x="473.5" y="408" width="419.5" height="90" rx="8" fill="#FFFFFF" stroke="#1E40AF88" stroke-width="1.5"/><text x="489.5" y="440" font-size="20.4" font-weight="700" fill="#1F2937" text-anchor="start">OpenMetadata</text><text x="489.5" y="464" font-size="16.8" font-weight="400" fill="#4B5563" text-anchor="start">Catálogo, glossário, linhagem, qualidade</text><rect x="473.5" y="508" width="419.5" height="90" rx="8" fill="#FFFFFF" stroke="#1E40AF88" stroke-width="1.5"/><text x="489.5" y="540" font-size="20.4" font-weight="700" fill="#1F2937" text-anchor="start">Apache Ranger</text><text x="489.5" y="564" font-size="16.8" font-weight="400" fill="#4B5563" text-anchor="start">Políticas por domínio, subdomínio e</text><text x="489.5" y="585.84" font-size="16.8" font-weight="400" fill="#4B5563" text-anchor="start">coluna; auditoria</text><rect x="473.5" y="608" width="419.5" height="90" rx="8" fill="#FFFFFF" stroke="#B45309" stroke-width="1.5" stroke-dasharray="6 5"/><text x="489.5" y="640" font-size="20.4" font-weight="700" fill="#1F2937" text-anchor="start">Splink</text><text x="489.5" y="664" font-size="16.8" font-weight="400" fill="#4B5563" text-anchor="start">Dados mestres — em homologação</text><path d="M894,366 H906" fill="none" stroke="#6B7280" stroke-width="2" marker-end="url(#ar)"/><rect x="907" y="336" width="419.5" height="60" rx="8" fill="#EDE9FE" stroke="#5B21B6" stroke-width="1.5"/><text x="1116.75" y="362" font-size="21.6" font-weight="700" fill="#5B21B6" text-anchor="middle">3. Publicar para quem precisa</text><text x="1116.75" y="384" font-size="16.8" font-weight="400" fill="#4B5563" text-anchor="middle">Compartilhar</text><rect x="907" y="408" width="419.5" height="90" rx="8" fill="#FFFFFF" stroke="#5B21B688" stroke-width="1.5"/><text x="923" y="440" font-size="20.4" font-weight="700" fill="#1F2937" text-anchor="start">Trino</text><text x="923" y="464" font-size="16.8" font-weight="400" fill="#4B5563" text-anchor="start">Consulta com login e política aplicada</text><rect x="907" y="508" width="419.5" height="90" rx="8" fill="#FFFFFF" stroke="#5B21B688" stroke-width="1.5"/><text x="923" y="540" font-size="20.4" font-weight="700" fill="#1F2937" text-anchor="start">WSO2 API Manager</text><text x="923" y="564" font-size="16.8" font-weight="400" fill="#4B5563" text-anchor="start">APIs, assinaturas e quotas</text><rect x="907" y="608" width="419.5" height="90" rx="8" fill="#FFFFFF" stroke="#5B21B688" stroke-width="1.5"/><text x="923" y="640" font-size="20.4" font-weight="700" fill="#1F2937" text-anchor="start">Concessões com prazo</text><text x="923" y="664" font-size="16.8" font-weight="400" fill="#4B5563" text-anchor="start">Pedido → decisão → concessão → revogação</text><path d="M1327.5,366 H1339.5" fill="none" stroke="#6B7280" stroke-width="2" marker-end="url(#ar)"/><rect x="1340.5" y="336" width="419.5" height="60" rx="8" fill="#FEF3C7" stroke="#B45309" stroke-width="1.5"/><text x="1550.25" y="362" font-size="21.6" font-weight="700" fill="#B45309" text-anchor="middle">4. Usar e medir o valor</text><text x="1550.25" y="384" font-size="16.8" font-weight="400" fill="#4B5563" text-anchor="middle">Ativar</text><rect x="1340.5" y="408" width="419.5" height="90" rx="8" fill="#FFFFFF" stroke="#B4530988" stroke-width="1.5"/><text x="1356.5" y="440" font-size="20.4" font-weight="700" fill="#1F2937" text-anchor="start">Trino (SQL)</text><text x="1356.5" y="464" font-size="16.8" font-weight="400" fill="#4B5563" text-anchor="start">Analistas e ferramentas de BI</text><rect x="1340.5" y="508" width="419.5" height="90" rx="8" fill="#FFFFFF" stroke="#B4530988" stroke-width="1.5"/><text x="1356.5" y="540" font-size="20.4" font-weight="700" fill="#1F2937" text-anchor="start">Apache Superset</text><text x="1356.5" y="564" font-size="16.8" font-weight="400" fill="#4B5563" text-anchor="start">Painéis com filtro por concessão (RLS)</text><rect x="1340.5" y="608" width="419.5" height="90" rx="8" fill="#FFFFFF" stroke="#B45309" stroke-width="1.5" stroke-dasharray="6 5"/><text x="1356.5" y="640" font-size="20.4" font-weight="700" fill="#1F2937" text-anchor="start">vassets API / MCP</text><text x="1356.5" y="664" font-size="16.8" font-weight="400" fill="#4B5563" text-anchor="start">Dados para aplicações e IA — em</text><text x="1356.5" y="685.84" font-size="16.8" font-weight="400" fill="#4B5563" text-anchor="start">homologação</text><text x="40" y="740" font-size="18.0" font-weight="700" fill="#B45309" text-anchor="start" letter-spacing="1">BASE COMUM — serviços transversais (todas as etapas)</text><rect x="40" y="754" width="334.4" height="104" rx="8" fill="#F3F4F6" stroke="#D1D5DB" stroke-width="1.5"/><text x="54" y="786" font-size="19.2" font-weight="700" fill="#1F2937" text-anchor="start">Identidade</text><text x="54" y="812" font-size="15.6" font-weight="400" fill="#4B5563" text-anchor="start">Keycloak + OpenLDAP</text><rect x="386.4" y="754" width="334.4" height="104" rx="8" fill="#F3F4F6" stroke="#D1D5DB" stroke-width="1.5"/><text x="400.4" y="786" font-size="19.2" font-weight="700" fill="#1F2937" text-anchor="start">Segredos</text><text x="400.4" y="812" font-size="15.6" font-weight="400" fill="#4B5563" text-anchor="start">OpenBao + External Secrets</text><rect x="732.8" y="754" width="334.4" height="104" rx="8" fill="#F3F4F6" stroke="#D1D5DB" stroke-width="1.5"/><text x="746.8" y="786" font-size="19.2" font-weight="700" fill="#1F2937" text-anchor="start">Observabilidade</text><text x="746.8" y="812" font-size="15.6" font-weight="400" fill="#4B5563" text-anchor="start">Prometheus · Loki · Tempo · Grafana</text><text x="746.8" y="832.28" font-size="15.6" font-weight="400" fill="#4B5563" text-anchor="start">· OTel</text><rect x="1079.1999999999998" y="754" width="334.4" height="104" rx="8" fill="#F3F4F6" stroke="#D1D5DB" stroke-width="1.5"/><text x="1093.1999999999998" y="786" font-size="19.2" font-weight="700" fill="#1F2937" text-anchor="start">Registro de evidências</text><text x="1093.1999999999998" y="812" font-size="15.6" font-weight="400" fill="#4B5563" text-anchor="start">PostgreSQL: hierarquia, contratos,</text><text x="1093.1999999999998" y="832.28" font-size="15.6" font-weight="400" fill="#4B5563" text-anchor="start">concessões, auditoria</text><rect x="1425.6" y="754" width="334.4" height="104" rx="8" fill="#F3F4F6" stroke="#D1D5DB" stroke-width="1.5"/><text x="1439.6" y="786" font-size="19.2" font-weight="700" fill="#1F2937" text-anchor="start">Entrega por código</text><text x="1439.6" y="812" font-size="15.6" font-weight="400" fill="#4B5563" text-anchor="start">Ansible · Kubernetes (k3d) · Helm ·</text><text x="1439.6" y="832.28" font-size="15.6" font-weight="400" fill="#4B5563" text-anchor="start">Argo CD</text><text x="40" y="894" font-size="18.0" font-weight="700" fill="#B45309" text-anchor="start" letter-spacing="1">AS CINCO CAMADAS NA IMPLEMENTAÇÃO — onde cada camada vive</text><rect x="40" y="908" width="334.4" height="132" rx="8" fill="#FEF3C7" stroke="#B45309" stroke-width="1.5"/><text x="54" y="938" font-size="19.2" font-weight="700" fill="#1F2937" text-anchor="start">01 Princípios e políticas</text><text x="54" y="966" font-size="15.6" font-weight="400" fill="#4B5563" text-anchor="start">Regras de operação versionadas no</text><text x="54" y="986.28" font-size="15.6" font-weight="400" fill="#4B5563" text-anchor="start">EcOps (com escopo, responsável e</text><text x="54" y="1006.56" font-size="15.6" font-weight="400" fill="#4B5563" text-anchor="start">vigência)</text><rect x="386.4" y="908" width="334.4" height="132" rx="8" fill="#FEF3C7" stroke="#B45309" stroke-width="1.5"/><text x="400.4" y="938" font-size="19.2" font-weight="700" fill="#1F2937" text-anchor="start">02 Organização e papéis</text><text x="400.4" y="966" font-size="15.6" font-weight="400" fill="#4B5563" text-anchor="start">Papéis por escopo (ecossistema,</text><text x="400.4" y="986.28" font-size="15.6" font-weight="400" fill="#4B5563" text-anchor="start">domínio, agrupamento, subdomínio) no</text><text x="400.4" y="1006.56" font-size="15.6" font-weight="400" fill="#4B5563" text-anchor="start">Keycloak/LDAP</text><rect x="732.8" y="908" width="334.4" height="132" rx="8" fill="#FEF3C7" stroke="#B45309" stroke-width="1.5"/><text x="746.8" y="938" font-size="19.2" font-weight="700" fill="#1F2937" text-anchor="start">03 Processos e decisões</text><text x="746.8" y="966" font-size="15.6" font-weight="400" fill="#4B5563" text-anchor="start">Menus Cultivar → Governar →</text><text x="746.8" y="986.28" font-size="15.6" font-weight="400" fill="#4B5563" text-anchor="start">Compartilhar → Ativar nos módulos;</text><text x="746.8" y="1006.56" font-size="15.6" font-weight="400" fill="#4B5563" text-anchor="start">Pendências</text><rect x="1079.1999999999998" y="908" width="334.4" height="132" rx="8" fill="#FEF3C7" stroke="#B45309" stroke-width="1.5"/><text x="1093.1999999999998" y="938" font-size="19.2" font-weight="700" fill="#1F2937" text-anchor="start">04 Controles e meios</text><text x="1093.1999999999998" y="966" font-size="15.6" font-weight="400" fill="#4B5563" text-anchor="start">Ranger, contratos ODCS,</text><text x="1093.1999999999998" y="986.28" font-size="15.6" font-weight="400" fill="#4B5563" text-anchor="start">OpenMetadata, WSO2, verificação</text><text x="1093.1999999999998" y="1006.56" font-size="15.6" font-weight="400" fill="#4B5563" text-anchor="start">automática</text><rect x="1425.6" y="908" width="334.4" height="132" rx="8" fill="#FEF3C7" stroke="#B45309" stroke-width="1.5"/><text x="1439.6" y="938" font-size="19.2" font-weight="700" fill="#1F2937" text-anchor="start">05 Evidências e melhoria</text><text x="1439.6" y="966" font-size="15.6" font-weight="400" fill="#4B5563" text-anchor="start">Registro do produto, auditoria sem</text><text x="1439.6" y="986.28" font-size="15.6" font-weight="400" fill="#4B5563" text-anchor="start">conteúdo, painéis no EcOps e PlatOps</text><rect x="40" y="1060" width="1720" height="64" rx="8" fill="#1F2937" stroke="#1F2937" stroke-width="1.5"/><text x="60" y="1087" font-size="18.0" font-weight="700" fill="#FFFFFF" text-anchor="start">Soberania: o dado do cliente fica no seu ambiente (Farm); a governança comum recebe só metadados.</text><text x="60" y="1110" font-size="15.6" font-weight="400" fill="#E5E7EB" text-anchor="start">Moldura tracejada = em homologação. Licenças: quase todas Apache-2.0; Grafana/Loki/Tempo AGPL usados sem modificação; OpenBao MPL-2.0.</text>
<text x="1760" y="1146" font-size="14.4" font-weight="400" fill="#9CA3AF" text-anchor="end">KDV Framework · análise do site · 20/10/2026</text>
</svg>