start">Custodiante técnico</text><rect x="1434" y="386" width="347" height="150" rx="8" fill="#FFFFFF" stroke="#B4530955" stroke-width="1.5"/><text x="1450" y="424" font-size="19.2" font-weight="400" fill="#1F2937" text-anchor="start">Consumidor + Dono do produto</text><rect x="40" y="546" width="300" height="150" rx="8" fill="#F3F4F6" stroke="#D1D5DB" stroke-width="1.5"/><text x="58" y="586" font-size="31.2" font-weight="700" fill="#B45309" text-anchor="start">03</text><text x="110" y="582" font-size="21.6" font-weight="700" fill="#1F2937" text-anchor="start">Processos e</text><text x="110" y="610.08" font-size="21.6" font-weight="700" fill="#1F2937" text-anchor="start">decisões</text><text x="110" y="630" font-size="16.8" font-weight="400" fill="#4B5563" text-anchor="start" font-style="italic">Como o trabalho avança</text><rect x="360" y="546" width="347" height="150" rx="8" fill="#FFFFFF" stroke="#16653455" stroke-width="1.5"/><text x="376" y="584" font-size="19.2" font-weight="400" fill="#1F2937" text-anchor="start">Decisão: a fonte está</text><text x="376" y="610.4" font-size="19.2" font-weight="400" fill="#1F2937" text-anchor="start">autorizada e o resultado pode</text><text x="376" y="636.8" font-size="19.2" font-weight="400" fill="#1F2937" text-anchor="start">ser explicado?</text><rect x="718" y="546" width="347" height="150" rx="8" fill="#FFFFFF" stroke="#1E40AF55" stroke-width="1.5"/><text x="734" y="584" font-size="19.2" font-weight="400" fill="#1F2937" text-anchor="start">Decisão: responsáveis, termos</text><text x="734" y="610.4" font-size="19.2" font-weight="400" fill="#1F2937" text-anchor="start">e qualidade foram revistos?</text><rect x="1076" y="546" width="347" height="150" rx="8" fill="#FFFFFF" stroke="#5B21B655" stroke-width="1.5"/><text x="1092" y="584" font-size="19.2" font-weight="400" fill="#1F2937" text-anchor="start">Decisão: o consumidor previsto</text><text x="1092" y="610.4" font-size="19.2" font-weight="400" fill="#1F2937" text-anchor="start">descobre e acessa a versão</text><text x="1092" y="636.8" font-size="19.2" font-weight="400" fill="#1F2937" text-anchor="start">autorizada?</text><rect x="1434" y="546" width="347" height="150" rx="8" fill="#FFFFFF" stroke="#B4530955" stroke-width="1.5"/><text x="1450" y="584" font-size="19.2" font-weight="400" fill="#1F2937" text-anchor="start">Decisão: valor e limitações</text><text x="1450" y="610.4" font-size="19.2" font-weight="400" fill="#1F2937" text-anchor="start">revistos — melhorar ou</text><text x="1450" y="636.8" font-size="19.2" font-weight="400" fill="#1F2937" text-anchor="start">retirar?</text><rect x="40" y="706" width="300" height="150" rx="8" fill="#F3F4F6" stroke="#D1D5DB" stroke-width="1.5"/><text x="58" y="746" font-size="31.2" font-weight="700" fill="#B45309" text-anchor="start">04</text><text x="110" y="742" font-size="21.6" font-weight="700" fill="#1F2937" text-anchor="start">Controles e</text><text x="110" y="770.08" font-size="21.6" font-weight="700" fill="#1F2937" text-anchor="start">meios</text><text x="110" y="790" font-size="16.8" font-weight="400" fill="#4B5563" text-anchor="start" font-style="italic">Como as regras se</text><text x="110" y="811.84" font-size="16.8" font-weight="400" fill="#4B5563" text-anchor="start" font-style="italic">aplicam</text><rect x="360" y="706" width="347" height="150" rx="8" fill="#FFFFFF" stroke="#16653455" stroke-width="1.5"/><text x="376" y="744" font-size="19.2" font-weight="400" fill="#1F2937" text-anchor="start">Pipeline reproduzível; testes</text><text x="376" y="770.4" font-size="19.2" font-weight="400" fill="#1F2937" text-anchor="start">iniciais de qualidade</text><rect x="718" y="706" width="347" height="150" rx="8" fill="#FFFFFF" stroke="#1E40AF55" stroke-width="1.5"/><text x="734" y="744" font-size="19.2" font-weight="400" fill="#1F2937" text-anchor="start">Contrato versionado; regras e</text><text x="734" y="770.4" font-size="19.2" font-weight="400" fill="#1F2937" text-anchor="start">limites de qualidade</text><rect x="1076" y="706" width="347" height="150" rx="8" fill="#FFFFFF" stroke="#5B21B655" stroke-width="1.5"/><text x="1092" y="744" font-size="19.2" font-weight="400" fill="#1F2937" text-anchor="start">Catálogo; política de acesso</text><text x="1092" y="770.4" font-size="19.2" font-weight="400" fill="#1F2937" text-anchor="start">aplicada; versões comunicadas</text><rect x="1434" y="706" width="347" height="150" rx="8" fill="#FFFFFF" stroke="#B4530955" stroke-width="1.5"/><text x="1450" y="744" font-size="19.2" font-weight="400" fill="#1F2937" text-anchor="start">Acesso com prazo;</text><text x="1450" y="770.4" font-size="19.2" font-weight="400" fill="#1F2937" text-anchor="start">monitoramento de uso e</text><text x="1450" y="796.8" font-size="19.2" font-weight="400" fill="#1F2937" text-anchor="start">incidentes</text><rect x="40" y="866" width="300" height="150" rx="8" fill="#FEF3C7" stroke="#B45309" stroke-width="1.5"/><text x="58" y="906" font-size="31.2" font-weight="700" fill="#B45309" text-anchor="start">05</text><text x="110" y="902" font-size="21.6" font-weight="700" fill="#1F2937" text-anchor="start">Evidências e</text><text x="110" y="930.08" font-size="21.6" font-weight="700" fill="#1F2937" text-anchor="start">melhoria</text><text x="110" y="950" font-size="16.8" font-weight="400" fill="#4B5563" text-anchor="start" font-style="italic">Como sabemos e</text><text x="110" y="971.84" font-size="16.8" font-weight="400" fill="#4B5563" text-anchor="start" font-style="italic">aprendemos</text><rect x="360" y="866" width="347" height="150" rx="8" fill="#FFFFFF" stroke="#16653455" stroke-width="1.5"/><text x="376" y="904" font-size="19.2" font-weight="400" fill="#1F2937" text-anchor="start">Inventário de fontes; registro</text><text x="376" y="930.4" font-size="19.2" font-weight="400" fill="#1F2937" text-anchor="start">das transformações</text><rect x="718" y="866" width="347" height="150" rx="8" fill="#FFFFFF" stroke="#1E40AF55" stroke-width="1.5"/><text x="734" y="904" font-size="19.2" font-weight="400" fill="#1F2937" text-anchor="start">Glossário; contrato;</text><text x="734" y="930.4" font-size="19.2" font-weight="400" fill="#1F2937" text-anchor="start">resultados de qualidade;</text><text x="734" y="956.8" font-size="19.2" font-weight="400" fill="#1F2937" text-anchor="start">decisões</text><rect x="1076" y="866" width="347" height="150" rx="8" fill="#FFFFFF" stroke="#5B21B655" stroke-width="1.5"/><text x="1092" y="904" font-size="19.2" font-weight="400" fill="#1F2937" text-anchor="start">Contrato publicado; aprovação;</text><text x="1092" y="930.4" font-size="19.2" font-weight="400" fill="#1F2937" text-anchor="start">histórico de versões</text><rect x="1434" y="866" width="347" height="150" rx="8" fill="#FFFFFF" stroke="#B4530955" stroke-width="1.5"/><text x="1450" y="904" font-size="19.2" font-weight="400" fill="#1F2937" text-anchor="start">Registro de uso; indicador de</text><text x="1450" y="930.4" font-size="19.2" font-weight="400" fill="#1F2937" text-anchor="start">valor; decisão de melhoria</text><path d="M26,236 V1006" fill="none" stroke="#B45309" stroke-width="2.5" marker-end="url(#arA)"/><path d="M1761,1042 H380" fill="none" stroke="#B45309" stroke-width="2" stroke-dasharray="7 6" marker-end="url(#arA)"/><text x="1070.5" y="1034" font-size="16.8" font-weight="700" fill="#B45309" text-anchor="middle">retorno: o uso (Ativar) melhora a próxima iteração (Cultivar)</text><rect x="40" y="1072" width="1720" height="150" rx="8" fill="#1F2937" stroke="#1F2937" stroke-width="1.5"/><text x="64" y="1110" font-size="21.6" font-weight="700" fill="#FFFFFF" text-anchor="start">BASELINE MÍNIMO — vale para todo produto de dados compartilhado, em todas as etapas</text><rect x="64" y="1130" width="323.2" height="74" rx="8" fill="#374151" stroke="#4B5563" stroke-width="1.5"/><text x="225.6" y="1162" font-size="20.4" font-weight="700" fill="#FDE68A" text-anchor="middle">✓ Responsável identificado</text><text