<text x="40" y="52" font-size="36.0" font-weight="700" fill="#1F2937" text-anchor="start">Anatomia do ecossistema — arquitetura de responsabilidades</text>
<text x="40" y="88" font-size="20.4" font-weight="400" fill="#4B5563" text-anchor="start">Termo do cliente em destaque; termo KDV na etiqueta. Exemplo fictício baseado no piloto sintético de um conselho profissional.</text>
<rect x="30" y="104" width="1740" height="772" rx="14" fill="#FCFCFB" stroke="#D1D5DB" stroke-width="1.5" stroke-dasharray="6 6"/><text x="50" y="132" font-size="18.0" font-weight="700" fill="#B45309" text-anchor="start" letter-spacing="1">PLANO DE NEGÓCIO — quem responde pelo dado</text><rect x="600" y="150" width="600" height="100" rx="8" fill="#1F2937" stroke="#1F2937" stroke-width="1.5"/><text x="900" y="178" font-size="21.6" font-weight="700" fill="#FFFFFF" text-anchor="middle">Rede de conselhos regionais (exemplo)</text><rect x="786.12" y="194.08" width="227.75999999999996" height="22" rx="11" fill="#FDE68A" stroke="none"/><text x="900" y="210.08" font-size="15.6" font-weight="700" fill="#B45309" text-anchor="middle">Ecossistema · Ecosystem</text><text x="900" y="236.08" font-size="16.8" font-weight="400" fill="#E5E7EB" text-anchor="middle">Propósito comum, políticas comuns e governança responsável</text><rect x="1250" y="140" width="500" height="124" rx="8" fill="#FEF3C7" stroke="#B45309" stroke-width="1.5"/><text x="1266" y="168" font-size="18.0" font-weight="700" fill="#1F2937" text-anchor="start">Papéis: Fórum de governança · Gestor do</text><text x="1266" y="191.4" font-size="18.0" font-weight="700" fill="#1F2937" text-anchor="start">ecossistema</text><text x="1266" y="226" font-size="15.6" font-weight="400" fill="#4B5563" text-anchor="start">Evidência: política, registro de decisões, indicador de</text><text x="1266" y="246.28" font-size="15.6" font-weight="400" fill="#4B5563" text-anchor="start">valor</text><rect x="190" y="296" width="560" height="104" rx="8" fill="#DBEAFE" stroke="#1E40AF" stroke-width="1.5"/><text x="470" y="324" font-size="21.6" font-weight="700" fill="#1F2937" text-anchor="middle">Área de negócio: Registro profissional</text><rect x="397.16" y="340.08" width="145.67999999999998" height="22" rx="11" fill="#FEF3C7" stroke="none"/><text x="470" y="356.08" font-size="15.6" font-weight="700" fill="#B45309" text-anchor="middle">Domínio · Hive</text><text x="470" y="382.08" font-size="16.8" font-weight="400" fill="#4B5563" text-anchor="middle">Dono do domínio · Steward coordenador</text><path d="M900,250 V275 H470 V298" fill="none" stroke="#6B7280" stroke-width="2" marker-end="url(#ar)"/><rect x="1050" y="296" width="560" height="104" rx="8" fill="#DBEAFE" stroke="#1E40AF" stroke-width="1.5"/><text x="1330" y="324" font-size="21.6" font-weight="700" fill="#1F2937" text-anchor="middle">Área de negócio: Fiscalização</text><rect x="1257.16" y="340.08" width="145.67999999999998" height="22" rx="11" fill="#FEF3C7" stroke="none"/><text x="1330" y="356.08" font-size="15.6" font-weight="700" fill="#B45309" text-anchor="middle">Domínio · Hive</text><text x="1330" y="382.08" font-size="16.8" font-weight="400" fill="#4B5563" text-anchor="middle">Dono do domínio · Steward coordenador</text><path d="M900,250 V275 H1330 V298" fill="none" stroke="#6B7280" stroke-width="2" marker-end="url(#ar)"/><rect x="62" y="444" width="726" height="146" rx="12" fill="none" stroke="#5B21B6" stroke-width="1.5" stroke-dasharray="8 6"/><rect x="242" y="578" width="366" height="24" rx="12" fill="#EDE9FE"/><text x="425" y="595" font-size="15.6" font-weight="700" fill="#5B21B6" text-anchor="middle">Agrupamento: Cadastro e cobrança · Comb</text><rect x="80" y="462" width="340" height="112" rx="8" fill="#DCFCE7" stroke="#166534" stroke-width="1.5"/><text x="250" y="490" font-size="21.6" font-weight="700" fill="#1F2937" text-anchor="middle">Subárea: Inscrições</text><rect x="163.48000000000002" y="506.08000000000004" width="173.04" height="22" rx="11" fill="#FEF3C7" stroke="none"/><text x="250" y="522.08" font-size="15.6" font-weight="700" fill="#B45309" text-anchor="middle">Subdomínio · Cell</text><text x="250" y="548.08" font-size="15.6" font-weight="400" fill="#4B5563" text-anchor="middle">Dono, steward e engenharia</text><path d="M470,396 V430 H250 V460" fill="none" stroke="#6B7280" stroke-width="2" marker-end="url(#ar)"/><rect x="80