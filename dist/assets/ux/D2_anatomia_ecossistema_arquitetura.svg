text><text x="610" y="739.92" font-size="15.6" font-weight="400" fill="#4B5563" text-anchor="middle">Dono · contrato · consumidores</text><path d="M610,574 V630" fill="none" stroke="#6B7280" stroke-width="2" marker-end="url(#ar)"/><rect x="940" y="462" width="340" height="112" rx="8" fill="#DCFCE7" stroke="#166534" stroke-width="1.5"/><text x="1110" y="490" font-size="21.6" font-weight="700" fill="#1F2937" text-anchor="middle">Subárea: Autuações</text><rect x="1023.48" y="506.08000000000004" width="173.04" height="22" rx="11" fill="#FEF3C7" stroke="none"/><text x="1110" y="522.08" font-size="15.6" font-weight="700" fill="#B45309" text-anchor="middle">Subdomínio · Cell</text><text x="1110" y="548.08" font-size="15.6" font-weight="400" fill="#4B5563" text-anchor="middle">Dono, steward e engenharia</text><path d="M1330,396 V430 H1110 V460" fill="none" stroke="#6B7280" stroke-width="2" marker-end="url(#ar)"/><rect x="940" y="632" width="340" height="132" rx="8" fill="#FFFBEB" stroke="#B45309" stroke-width="1.5"/><text x="1110" y="660" font-size="19.2" font-weight="700" fill="#1F2937" text-anchor="middle">Autos por região (API)</text><rect x="1028.04" y="672.96" width="163.92" height="22" rx="11" fill="#FEF3C7" stroke="none"/><text x="1110" y="688.96" font-size="15.6" font-weight="700" fill="#B45309" text-anchor="middle">Produto de dados</text><text x="1110" y="714.96" font-size="15.6" font-weight="400" fill="#4B5563" text-anchor="middle">Dono · contrato · consumidores</text><path d="M1110,574 V630" fill="none" stroke="#6B7280" stroke-width="2" marker-end="url(#ar)"/><rect x="1300" y="462" width="340" height="112" rx="8" fill="#DCFCE7" stroke="#166534" stroke-width="1.5"/><text x="1470" y="490" font-size="21.6" font-weight="700" fill="#1F2937" text-anchor="middle">Subárea: Vistorias</text><rect x="1383.48" y="506.08000000000004" width="173.04" height="22" rx="11" fill="#FEF3C7" stroke="none"/><text x="1470" y="522.08" font-size="15.6" font-weight="700" fill="#B45309" text-anchor="middle">Subdomínio · Cell</text><text x="1470" y="548.08" font-size="15.6" font-weight="400" fill="#4B5563" text-anchor="middle">Dono, steward e engenharia</text><path d="M1330,396 V430 H1470 V460" fill="none" stroke="#6B7280" stroke-width="2" marker-end="url(#ar)"/><rect x="1300" y="632" width="340" height="132" rx="8" fill="#FFFBEB" stroke="#B45309" stroke-width="1.5"/><text x="1470" y="660" font-size="19.2" font-weight="700" fill="#1F2937" text-anchor="middle">Agenda de vistorias (MCP)</text><rect x="1388.04" y="672.96" width="163.92" height="22" rx="11" fill="#FEF3C7" stroke="none"/><text x="1470" y="688.96" font-size="15.6" font-weight="700" fill="#B45309" text-anchor="middle">Produto de dados</text><text x="1470" y="714.96" font-size="15.6" font-weight="400" fill="#4B5563" text-anchor="middle">Dono · contrato · consumidores</text><path d="M1470,574 V630" fill="none" stroke="#6B7280" stroke-width="2" marker-end="url(#ar)"/><text x="50" y="790" font-size="18.0" font-weight="700" fill="#4B5563" text-anchor="start">Consumidores</text><rect x="200" y="800" width="330" height="52" rx="26" fill="#F3F4F6" stroke="#D1D5DB" stroke-width="1.5"/><text x="365" y="832" font-size="19.2" font-weight="700" fill="#1F2937" text-anchor="middle">Gestão e diretoria</text><path d="M250,764 V780 H365 V798" fill="none" stroke="#6B7280" stroke-width="2" stroke-dasharray="5 5" marker-end="url(#ar)"/><rect x="590" y="800" width="330" height="52" rx="26" fill="#F3F4F6" stroke="#D1D5DB" stroke-width="1.5"/><text x="755" y="832" font-size="19.2" font-weight="700" fill="#1F2937" text-anchor="middle">Analistas e BI</text><path d="M610,764 V780 H755 V798" fill="none" stroke="#6B7280" stroke-width="2" stroke-dasharray="5 5" marker-end="url(#ar)"/><rect x="980" y="800" width="330" height="52" rx="26" fill="#F3F4F6" stroke="#D1D5DB" stroke-width="1.5"/><text x="1145" y="832" font-size="19.2" font-weight="700" fill="#1F2937" text-anchor="middle">Outros órgãos parceiros</text><path d="M1110,764 V780 H1145 V798" fill="none" stroke="#6B7280" stroke-width="2" stroke-dasharray="5 5" marker-end="url(#ar)"/><rect x="1370" y="800" width="330" height="52" rx="26" fill="#F3F4F6" stroke="#D1D5DB" stroke-width="1.5"/><text x="1535" y="832" font-size="19.2" font-weight="700" fill="#1F2937" text-anchor="middle">Agentes de IA</text><path d="M1470,764 V780 H1535 V798" fill="none" stroke="#6B7280" stroke-width="2" stroke-dasharray="5 5" marker-end="url(#ar)"/><rect x="30" y="906" width="1740" height="250" rx="14" fill="#F9FAFB" stroke="#D1D5DB" stroke-width="1.5" stroke-dasharray="6 6"/><text x="50" y="934" font-size="18.0" font-weight="700" fill="#B45309" text-anchor="start" letter-spacing="1">PLANO DE EXECUÇÃO — onde os produtos são cultivados e operados</text><rect x="60" y="956" width="280" height="112" rx="8" fill="#FFFFFF" stroke="#1F2937" stroke-width="1.5"/><text x="200" y="984" font-size="20.4" font-weight="700" fill="#1F2937" text-anchor="middle">Produção</text><rect x="81.56000000000002" y="998.52" width="236.87999999999997" height="22" rx="11" fill="#FEF3C7" stroke="none"/><text x="200" y="1014.52" font-size="15.6" font-weight="700" fill="#B45309" text-anchor="middle">Farm · prd · obrigatória</text><text x="200" y="1040.52" font-size="16.8" font-weight="400" fill="#4B5563" text-anchor="middle">Dado real</text><rect x="360" y="956" width="280" height="112" rx="8" fill="#FFFFFF" stroke="#1F2937" stroke-width="1.5"/><text x="500" y="984" font-size="20.4" font-weight="700" fill="#1F2937" text-anchor="middle">Homologação</text><rect x="395.24" y="998.52" width="209.51999999999998" height="22" rx="11" fill="#FEF3C7" stroke="none"/><text x="500" y="1014.52" font-size="15.6" font-weight="700" fill="#B45309" text-anchor="middle">Farm · hml · opcional</text><text x="500" y="1040.52" font-size="16.8" font-weight="400" fill="#4B5563" text-anchor="middle">Dado mascarado ou sintético</text><rect x="660" y="956" width="280" height="112" rx="8" fill="#FFFFFF" stroke="#1F2937" stroke-width="1.5"/><text x="800" y="984" font-size="20.4" font-weight="700" fill="#1F2937" text-anchor="middle">Desenvolvimento</text><rect x="695.24" y="998.52" width="209.51999999999998" height="22" rx="11" fill="#FEF3C7" stroke="none"/><text x="800" y="1014.52" font-size="15.6" font-weight="700" fill="#B45309" text-anchor="middle">Farm · dev · opcional</text><text x="800" y="1040.52" font-size="16.8" font-weight="400" fill="#4B5563" text-anchor="middle">Dado sintético</text><rect x="960" y="956" width="280" height="112" rx="8" fill="#FFFFFF" stroke="#1F2937" stroke-width="1.5"/><text x="1100" y="984" font-size="20.4" font-weight="700" fill="#1F2937" text-anchor="middle">Experimentação</text><rect x="977" y="998.52" width="246" height="22" rx="11" fill="#FEF3C7" stroke="none"/><text x="1100" y="1014.52" font-size="15.6" font-weight="700" fill="#B45309" text-anchor="middle">Farm · sbx · prazo e cota</text><text x="1100" y="1040.52" font-size="16.8" font-weight="400" fill="#4B5563" text-anchor="middle">Fora da promoção</text><rect x="1280" y="956" width="460" height="180" rx="8" fill="#FEF3C7" stroke="#B45309" stroke-width="1.5"/><text x="1296" y="984" font-size="18.0" font-weight="700" fill="#1F2937" text-anchor="start">Custodiante técnico opera os ambientes</text><text x="1296" y="1007.4" font-size="18.0" font-weight="700" fill="#1F2937" text-anchor="start">e aplica os controles autorizados.</text><text x="1296" y="1046" font-size="15.6" font-weight="400" fill="#4B5563" text-anchor="start">Código sobe por promoção (dev → hml → prd); dado só</text><text x="1296" y="1066.28" font-size="15.6" font-weight="400" fill="#4B5563" text-anchor="start">desce, mascarado ou sintético. O dado do cliente</text><text x="1296" y="1086.56" font-size="15.6" font-weight="400" fill="#4B5563" text-anchor="start">fica no seu ambiente; a governança comum vê só</text><text x="1296" y="1106.84" font-size="15.6" font-weight="400" fill="#4B5563" text-anchor="start">metadados.</text><text x="60" y="1112" font-size="16.8" font-weight="400" fill="#4B5563" text-anchor="start" font-style="italic">Os domínios e subdomínios existem em cada ambiente; o ambiente delimita a execução e não muda quem responde pelo dado.</text><path d="M1230,876 V952" fill="none" stroke="#B45309" stroke-width="2" stroke-dasharray="6 5" marker-end="url(#arA)"/><text x="1240" y="902" font-size="15.6" font-weight="700" fill="#B45309" text-anchor="start">produtos rodam em</text>
